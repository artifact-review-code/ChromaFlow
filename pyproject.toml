[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromaflow-nuclei"
version = "0.1.0"
description = "Point-supervised nuclei instance segmentation with stain-aware flow supervision."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["chromaflow*"]
